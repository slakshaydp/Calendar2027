<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 Interactive Couple Calendar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      /* Default 10% Ultra-Clear Airy Glassmorphism */
      --glass-blur: 4px;
      --glass-sat: 125%;
      --glass-g1: 0.22;
      --glass-g2: 0.14;
      --glass-g3: 0.18;
      --glass-border: 0.34;
      --glass-inset-top: 0.45;
      --glass-inset-bot: 0.12;
      --wash-opacity: 0.05;
      --photo-pos: center top;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fdf6ec;
      color: #1c1917;
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Soft Pastel Cream & Blush Watercolor Fallback Canvas */
    .watercolor-fallback {
      background-color: #fdf6ec;
      background-image:
        radial-gradient(circle at 12% 16%, rgba(244, 182, 204, 0.55) 0%, transparent 46%),
        radial-gradient(circle at 88% 12%, rgba(216, 190, 240, 0.50) 0%, transparent 46%),
        radial-gradient(circle at 82% 80%, rgba(248, 200, 214, 0.48) 0%, transparent 50%),
        radial-gradient(circle at 16% 84%, rgba(224, 200, 244, 0.44) 0%, transparent 48%);
    }

    /* Responsive Desktop Container up to 1440px */
    .app-container {
      width: min(94vw, 1440px);
      margin-left: auto;
      margin-right: auto;
    }

    /* Full-Year Responsive Grid: 4x3 Desktop, 3x4 Tablet, 2-col Small Tablet, 1-col Mobile */
    .year-calendar-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 520px) {
      .year-calendar-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }
    @media (min-width: 768px) {
      .year-calendar-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
    }
    @media (min-width: 1120px) {
      .year-calendar-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
    }

    /* Strict 7-Column Monthly Focus Grid (Zero Horizontal Overflow on Mobile & Desktop) */
    .month-grid-7 {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
    }
    @media (min-width: 768px) {
      .month-grid-7 {
        gap: 8px;
      }
    }

    .month-day-cell {
      min-width: 0;
      min-height: 56px;
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .month-day-cell {
        min-height: 98px;
      }
    }

    /* Hide scrollbar on mobile horizontal month pill bar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Full-Screen Photo Background Layer */
    #bg-fullscreen-wrap {
      position: fixed;
      inset: 0;
      z-index: -30;
      overflow: hidden;
      pointer-events: none;
    }

    #bg-photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--photo-pos);
      transition: object-position 0.3s ease, opacity 0.6s ease;
    }

    /* Subtle Translucent Wash Over Full-Screen Photo */
    #bg-wash-layer {
      position: fixed;
      inset: 0;
      z-index: -20;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(253, 246, 236, var(--wash-opacity)) 0%,
        rgba(252, 241, 244, calc(var(--wash-opacity) + 0.04)) 55%,
        rgba(249, 241, 248, calc(var(--wash-opacity) + 0.07)) 100%
      );
      transition: background 0.25s ease;
    }

    /* Poster Top Feathered Blend */
    .poster-mask {
      -webkit-mask-image: linear-gradient(to bottom, black 64%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 64%, transparent 100%);
    }

    /* Adaptive Liquid Glass Surface (Scales smoothly from 10% airy to 100% glossy) */
    .liquid-glass {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, var(--glass-g1)) 0%,
        rgba(255, 255, 255, var(--glass-g2)) 50%,
        rgba(255, 255, 255, var(--glass-g3)) 100%
      );
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      border: 1px solid rgba(255, 255, 255, var(--glass-border));
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, var(--glass-inset-top)),
        inset 0 -1px 1px rgba(255, 255, 255, var(--glass-inset-bot)),
        0 10px 28px -10px rgba(52, 30, 42, 0.18),
        0 2px 8px rgba(52, 30, 42, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .liquid-glass-card:hover {
      box-shadow:
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.75),
        inset 0 -1px 1px rgba(255, 255, 255, 0.25),
        0 16px 36px -10px rgba(52, 30, 42, 0.24),
        0 4px 12px rgba(52, 30, 42, 0.07);
    }

    /* =========================================================================
       CRITICAL FIX: '2027' HEADER BUBBLE CENTERING (ALL 4 SIDES, DESKTOP & MOBILE)
       ========================================================================= */
    .year-bubble {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border-radius: 9999px;
      box-sizing: border-box;
      padding: 10px 28px;
      max-width: calc(100vw - 2rem);
    }

    @media (min-width: 768px) {
      .year-bubble {
        padding: 14px 36px;
      }
    }

    .year-title {
      margin: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      padding-inline-end: 0 !important;
      padding-inline-start: 0.16em !important;
      line-height: 1 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-variant-numeric: lining-nums tabular-nums;
      letter-spacing: 0.16em;
    }

    /* Razor-sharp, clean typography with ZERO white glow, halo, or text-shadow */
    .crisp-text,
    h1, h2, h3,
    #calendar-grid button,
    #focus-days-grid button,
    #bottom-legend {
      text-shadow: none !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Higher-Legibility Glossy Panel for Modals, Popover & Drawer */
    .liquid-glass-panel {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.88) 0%,
        rgba(255, 250, 252, 0.76) 52%,
        rgba(255, 255, 255, 0.84) 100%
      );
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px rgba(255, 255, 255, 0.35),
        0 24px 54px -12px rgba(54, 30, 44, 0.30);
    }

    /* Ultra-Small Discreet 26px x 26px Floating Settings Button */
    #settings-fab {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.34) 100%);
      backdrop-filter: blur(14px) saturate(170%);
      -webkit-backdrop-filter: blur(14px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 3px 10px rgba(64, 38, 52, 0.18);
      opacity: 0.5;
      transition: opacity 0.2s ease, transform 0.25s ease, box-shadow 0.2s ease;
    }

    #settings-fab:hover,
    #settings-fab:focus-visible,
    #settings-fab[aria-expanded="true"] {
      opacity: 1;
      transform: scale(1.08);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        0 5px 14px rgba(64, 38, 52, 0.26);
    }

    #settings-fab[aria-expanded="true"] svg {
      transform: rotate(65deg);
    }

    /* Milestone Date Highlights */
    .milestone-anniversary {
      background: linear-gradient(135deg, rgba(255, 241, 235, 0.92) 0%, rgba(253, 226, 228, 0.92) 100%);
      border: 1.5px solid #d9777f;
      box-shadow: 0 0 12px rgba(217, 119, 127, 0.45);
    }

    .milestone-her-bday {
      background: linear-gradient(135deg, rgba(255, 240, 247, 0.92) 0%, rgba(251, 207, 232, 0.92) 100%);
      border: 1.5px solid #ec4899;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.40);
    }

    .milestone-his-bday {
      background: linear-gradient(135deg, rgba(239, 246, 255, 0.92) 0%, rgba(186, 230, 253, 0.92) 100%);
      border: 1.5px solid #0284c7;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.36);
    }

    .milestone-custom {
      background: linear-gradient(135deg, rgba(245, 243, 255, 0.92) 0%, rgba(233, 213, 255, 0.92) 100%);
      border: 1.5px solid #9333ea;
      box-shadow: 0 0 12px rgba(147, 51, 234, 0.34);
    }

    @keyframes pulseRing {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 119, 138, 0.8); }
      50% { transform: scale(1.12); box-shadow: 0 0 0 10px rgba(217, 119, 138, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 119, 138, 0); }
    }

    .date-pulse {
      animation: pulseRing 0.85s ease-in-out 2;
      z-index: 20;
    }

    input[type="range"] {
      accent-color: #c25174;
    }

    /* Print / PDF Export */
    @media print {
      body {
        background: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .no-print {
        display: none !important;
      }
      #bg-fullscreen-wrap,
      #bg-wash-layer {
        position: fixed !important;
      }
      .liquid-glass {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
        border: 1px solid #e6d8d2 !important;
        break-inside: avoid;
      }
      .year-calendar-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
        gap: 10px !important;
      }
      #poster-top-section {
        max-height: 250px !important;
      }
    }
  </style>
</head>
<body class="watercolor-fallback relative selection:bg-pink-200 selection:text-rose-950">

  <!-- Full-Screen Background Image & Soft Wash Overlay -->
  <div id="bg-fullscreen-wrap">
    <img id="bg-photo-img" referrerpolicy="no-referrer" alt="Couple Background Portrait" class="opacity-0" />
  </div>
  <div id="bg-wash-layer"></div>

  <!-- Ambient Floating Hearts & Petals Canvas (Active by default) -->
  <canvas id="ambient-canvas" class="no-print fixed inset-0 pointer-events-none z-20"></canvas>

  <!-- Celebration Confetti & Hearts Canvas -->
  <canvas id="confetti-canvas" class="no-print fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- Hidden File Inputs for Custom Photo & JSON Restore -->
  <input type="file" id="photo-upload-input" accept="image/*" class="hidden" />
  <input type="file" id="json-import-input" accept="application/json,.json" class="hidden" />

  <!-- ULTRA-SMALL 26px x 26px FLOATING SETTINGS BUTTON (Top-Right) -->
  <button
    id="settings-fab"
    type="button"
    aria-label="Calendar Settings"
    aria-expanded="false"
    aria-controls="settings-popover"
    class="no-print fixed top-3 right-3 z-40 rounded-full flex items-center justify-center text-stone-800 hover:text-rose-700 cursor-pointer focus:outline-none"
    title="Settings"
  >
    <svg class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
  </button>

  <!-- COMPACT GLOSSY SETTINGS POPOVER -->
  <aside
    id="settings-popover"
    class="no-print hidden fixed top-11 right-3 z-40 w-72 sm:w-80 max-h-[84vh] overflow-y-auto liquid-glass-panel rounded-2xl p-4 text-stone-800 origin-top-right"
    role="dialog"
    aria-label="Calendar Settings"
  >
    <div class="flex items-center justify-between pb-2 mb-3 border-b border-rose-200/60">
      <h2 class="font-serif text-base font-bold text-stone-900">Calendar Settings</h2>
      <button id="btn-close-popover" type="button" class="p-1 rounded-lg hover:bg-rose-100/70 text-stone-500 hover:text-stone-800 transition cursor-pointer" aria-label="Close settings">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <!-- 1. Calendar View Mode -->
      <div>
        <span class="block font-semibold text-stone-600 mb-1">Calendar View</span>
        <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-purple-100/60 border border-purple-200/50">
          <button id="view-year" type="button" class="py-1.5 rounded-lg font-semibold transition cursor-pointer">Full Year</button>
          <button id="view-month" type="button" class="py-1.5 rounded-lg font-semibold transition cursor-pointer">Monthly Focus</button>
        </div>
      </div>

      <!-- 2. Background Mode -->
      <div>
        <span class="block font-semibold text-stone-600 mb-1">Background Mode</span>
        <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-rose-100/60 border border-rose-200/50">
          <button id="mode-fullscreen" type="button" class="py-1.5 rounded-lg font-semibold transition cursor-pointer">Full-Screen</button>
          <button id="mode-poster" type="button" class="py-1.5 rounded-lg font-semibold transition cursor-pointer">Poster Header</button>
        </div>
      </div>

      <!-- 3. Glass Glossiness Slider (Default 10%, Range 10% - 100%) -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="gloss-slider" class="font-semibold text-stone-600">Glass Glossiness</label>
          <span id="gloss-value-label" class="font-bold text-rose-700">10%</span>
        </div>
        <input id="gloss-slider" type="range" min="10" max="100" value="10" class="w-full h-1.5 cursor-pointer" />
      </div>

      <!-- 4. Photo Framing -->
      <div>
        <span class="block font-semibold text-stone-600 mb-1">Photo Framing</span>
        <div class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-stone-100/80 border border-stone-200/70">
          <button data-pos="center top" class="pos-btn py-1.5 rounded-lg font-semibold transition cursor-pointer">Top</button>
          <button data-pos="center center" class="pos-btn py-1.5 rounded-lg font-semibold transition cursor-pointer">Center</button>
          <button data-pos="center bottom" class="pos-btn py-1.5 rounded-lg font-semibold transition cursor-pointer">Bottom</button>
        </div>
      </div>

      <!-- 5. Interactive Toggles -->
      <div class="space-y-2 pt-1">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-stone-700">Floating Hearts &amp; Petals</span>
          <button id="toggle-ambient" type="button" role="switch" aria-checked="true" class="relative inline-flex h-5 w-9 items-center rounded-full bg-rose-500 transition-colors cursor-pointer">
            <span id="toggle-ambient-knob" class="inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition-transform translate-x-4"></span>
          </button>
        </div>

        <div class="flex items-center justify-between">
          <span class="font-semibold text-stone-700">Live Milestone Countdown</span>
          <button id="toggle-countdown" type="button" role="switch" aria-checked="true" class="relative inline-flex h-5 w-9 items-center rounded-full bg-rose-500 transition-colors cursor-pointer">
            <span id="toggle-countdown-knob" class="inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition-transform translate-x-4"></span>
          </button>
        </div>
      </div>

      <!-- 6. All Notes & Events Directory Button -->
      <div class="pt-2 border-t border-rose-200/60">
        <button id="btn-open-directory" type="button" class="w-full py-2 px-3 rounded-xl bg-white/90 hover:bg-rose-50 text-stone-800 border border-rose-200/80 font-semibold flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer">
          <span>📖</span>
          <span>All Notes &amp; Events</span>
        </button>
      </div>

      <!-- 7. Photo Upload & Reset -->
      <div class="grid grid-cols-2 gap-2">
        <button id="btn-change-photo" type="button" class="py-2 px-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-semibold shadow-sm transition active:scale-95 cursor-pointer">
          Upload Photo
        </button>
        <button id="btn-reset-photo" type="button" class="py-2 px-2.5 rounded-xl bg-white/90 hover:bg-rose-50 text-stone-700 border border-stone-200 font-semibold transition active:scale-95 cursor-pointer">
          Reset Default
        </button>
      </div>

      <!-- 8. Export / Import Backup (JSON) -->
      <div class="grid grid-cols-2 gap-2">
        <button id="btn-export-json" type="button" class="py-1.5 px-2 rounded-xl bg-white/85 hover:bg-purple-50 text-stone-700 border border-purple-200/70 font-semibold transition active:scale-95 cursor-pointer">
          Export JSON
        </button>
        <button id="btn-import-json" type="button" class="py-1.5 px-2 rounded-xl bg-white/85 hover:bg-purple-50 text-stone-700 border border-purple-200/70 font-semibold transition active:scale-95 cursor-pointer">
          Import JSON
        </button>
      </div>

      <!-- 9. Print / Save PDF -->
      <button id="btn-print" type="button" class="w-full py-2 px-3 rounded-xl bg-stone-800 hover:bg-stone-900 text-white font-semibold flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        <span>Print / Save PDF</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CLEAN CALENDAR CANVAS (Up to 1440px Desktop Container) -->
  <main class="app-container relative z-10 pt-5 sm:pt-7 pb-10">

    <!-- Poster Header Portrait Container (Active in Poster Header Mode) -->
    <section id="poster-top-section" class="hidden mb-3">
      <div class="relative max-w-3xl mx-auto h-72 sm:h-96 md:h-[27rem] rounded-3xl overflow-hidden poster-mask">
        <img id="poster-photo-img" referrerpolicy="no-referrer" alt="Couple Portrait" class="w-full h-full object-cover transition-all duration-300" />
      </div>
    </section>

    <!-- STANDALONE SYMMETRIC '2027' HEADER BUBBLE + SEPARATE LIVE COUNTDOWN PILL -->
    <header class="flex flex-col items-center justify-center mb-5 sm:mb-7 gap-2.5 px-2">
      <!-- Dedicated 4-side symmetric glass bubble for '2027' -->
      <div class="liquid-glass year-bubble">
        <h1 class="year-title font-serif text-4xl sm:text-5xl md:text-6xl lg:text-[4.25rem] font-semibold text-[#1c1917] crisp-text select-none">2027</h1>
      </div>

      <!-- Separate Live Milestone Countdown Pill (Rendered cleanly below) -->
      <div id="next-countdown-wrap" class="w-full flex justify-center px-2"></div>
    </header>

    <!-- FULL-YEAR VIEW (12-Month Responsive Grid: 4x3 Desktop, 3x4 Tablet, 2x6 Small Tablet, 1x12 Mobile) -->
    <section id="full-year-view">
      <div id="calendar-grid" class="year-calendar-grid">
        <!-- 12 Month Cards generated dynamically -->
      </div>
    </section>

    <!-- RESPONSIVE MONTHLY FOCUS VIEW (Desktop & Mobile) -->
    <section id="month-focus-view" class="hidden w-full max-w-[980px] mx-auto">
      <div class="liquid-glass rounded-3xl p-3 sm:p-6 md:p-7">

        <!-- Header Controls: Prev, Month Title + Dropdown, Next, Full Year Button -->
        <div class="flex items-center justify-between gap-2 mb-3.5">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <button id="btn-prev-month" type="button" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/75 hover:bg-white border border-white/80 text-stone-800 shadow-sm flex items-center justify-center text-lg font-bold transition active:scale-95 cursor-pointer" aria-label="Previous Month" title="Previous Month (Left Arrow)">

    const STICKERS = [

    // Default Settings
    let settings = {
      layoutMode: 'fullscreen',    // 'fullscreen' | 'poster'
      glassGlossiness: 10,         // Default 10% (range 10 - 100)
      photoPosition: 'center top', // 'center top' | 'center center' | 'center bottom'

    // User Data
    let userData = {

      notes: {},
      stickers: {},
      customMilestones: {}
    };

    let selectedDateKey = null;
    let directoryFilter = 'all';

    /* =========================================================================
       2. HELPERS & LOCALSTORAGE PERSISTENCE
       ========================================================================= */
    function formatDateKey(y, mIndex, d) {
      return `${y}-${String(mIndex + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatShortDate(key) {
      const d = parseDateKey(key);
      return `${SHORT_MONTHS[d.getMonth()]} ${d.getDate()}`;
    }

    function getDaysDiff(dateKey) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = parseDateKey(dateKey);
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getCountdownText(dateKey) {
      const diff = getDaysDiff(dateKey);
      if (diff > 1) return `In ${diff} days`;
      if (diff === 1) return 'Tomorrow!';
      if (diff === 0) return 'Today! 🎉';
      if (diff === -1) return 'Yesterday';
      return `${Math.abs(diff)} days ago`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function getMilestone(dateKey) {
      if (DEFAULT_MILESTONES[dateKey]) return DEFAULT_MILESTONES[dateKey];
      const custom = userData.customMilestones[dateKey];
      if (custom) {
        return {
          title: custom.title,
          subtitle: 'Custom pinned special day',
          icon: custom.icon || '💖',
          cellClass: 'milestone-custom',
          textClass: 'text-purple-800',
          bannerBg: 'bg-gradient-to-r from-purple-50 to-pink-50 border-purple-300',
          confettiColors: ['#9333ea', '#c084fc', '#ec4899', '#fbbf24', '#f472b6'],
          confettiShape: 'heart',
          isDefault: false
        };
      }
      return null;
    }

    function getAllMilestonesSorted() {
      const merged = [];
      Object.keys(DEFAULT_MILESTONES).forEach(k => merged.push({ key: k, ...DEFAULT_MILESTONES[k] }));
      Object.keys(userData.customMilestones).forEach(k => {
        if (!DEFAULT_MILESTONES[k]) merged.push({ key: k, ...getMilestone(k) });
      });
      return merged.sort((a, b) => a.key.localeCompare(b.key));
    }

    function loadStorage() {
      try {
        const rawSettings = localStorage.getItem(SETTINGS_KEY);
        if (rawSettings) {
          settings = { ...settings, ...JSON.parse(rawSettings) };
        }

        const rawUserData = localStorage.getItem(USER_DATA_KEY);
        if (rawUserData) {
          const parsed = JSON.parse(rawUserData);
          userData = {
            customPhotoDataUrl: parsed.customPhotoDataUrl || null,
            notes: parsed.notes || {},
            stickers: parsed.stickers || {},
            customMilestones: parsed.customMilestones || {}
          };
        }
      } catch (err) {
        console.warn('Could not load saved storage:', err);
      }
    }

    let toastTimer = null;
    function showToast(msg = 'Saved locally') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 1700);
    }

    function persistAll(toastMsg = 'Saved locally') {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        localStorage.setItem(USER_DATA_KEY, JSON.stringify(userData));
        if (toastMsg) showToast(toastMsg);
      } catch (err) {
        console.warn('localStorage quota exceeded:', err);
        showToast('Storage full (photo too large)');
      }
    }

    /* =========================================================================
       3. BACKGROUND IMAGE LOADER (GOOGLE DRIVE 3-URL FALLBACK CHAIN)
       ========================================================================= */
    function loadDriveChain(imgEl, idx) {
      if (idx >= DRIVE_FALLBACK_URLS.length) {
        imgEl.classList.add('opacity-0');
        return;
      }
      imgEl.onerror = () => loadDriveChain(imgEl, idx + 1);
      imgEl.src = DRIVE_FALLBACK_URLS[idx];
    }

    function loadImageWithFallback(imgEl, customSrc) {
      imgEl.onload = () => {
        imgEl.classList.remove('opacity-0');
        imgEl.classList.add('opacity-100');
      };
      if (customSrc) {
        imgEl.onerror = () => loadDriveChain(imgEl, 0);
        imgEl.src = customSrc;
      } else {
        loadDriveChain(imgEl, 0);
      }
    }

    function refreshBackgroundImages() {
      loadImageWithFallback(document.getElementById('bg-photo-img'), userData.customPhotoDataUrl);
      loadImageWithFallback(document.getElementById('poster-photo-img'), userData.customPhotoDataUrl);
    }

    function processUploadedPhoto(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 1800;
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            const scale = MAX_DIM / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const c = document.createElement('canvas');
          c.width = width;
          c.height = height;
          c.getContext('2d').drawImage(img, 0, 0, width, height);
          userData.customPhotoDataUrl = c.toDataURL('image/jpeg', 0.85);
          refreshBackgroundImages();
          persistAll('Photo saved locally');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* =========================================================================
       4. APPLY APPEARANCE & GLASS GLOSSINESS SCALING (10% AIRY -> 100% GLOSSY)
       ========================================================================= */
    function applyAppearance() {
      const norm = Math.max(0, Math.min(1, (settings.glassGlossiness - 10) / 90));

      const blurPx = (4 + norm * 18).toFixed(1);          // 4px -> 22px
      const satPct = Math.round(125 + norm * 65);         // 125% -> 190%
      const g1 = (0.22 + norm * 0.40).toFixed(2);         // 0.22 -> 0.62
      const g2 = (0.14 + norm * 0.14).toFixed(2);         // 0.14 -> 0.28
      const g3 = (0.18 + norm * 0.26).toFixed(2);         // 0.18 -> 0.44
      const borderA = (0.34 + norm * 0.40).toFixed(2);    // 0.34 -> 0.74
      const insetTop = (0.45 + norm * 0.45).toFixed(2);   // 0.45 -> 0.90
      const insetBot = (0.12 + norm * 0.18).toFixed(2);   // 0.12 -> 0.30
      const wash = (0.05 + norm * 0.11).toFixed(2);       // 0.05 -> 0.16

      const root = document.documentElement.style;
      root.setProperty('--glass-blur', `${blurPx}px`);
      root.setProperty('--glass-sat', `${satPct}%`);
      root.setProperty('--glass-g1', g1);
      root.setProperty('--glass-g2', g2);
      root.setProperty('--glass-g3', g3);
      root.setProperty('--glass-border', borderA);
      root.setProperty('--glass-inset-top', insetTop);
      root.setProperty('--glass-inset-bot', insetBot);
      root.setProperty('--wash-opacity', wash);
      root.setProperty('--photo-pos', settings.photoPosition);

      document.getElementById('poster-photo-img').style.objectPosition = settings.photoPosition;
      document.getElementById('gloss-slider').value = settings.glassGlossiness;
      document.getElementById('gloss-value-label').textContent = `${settings.glassGlossiness}%`;

      // Full-Screen vs Poster Header
      const fsWrap = document.getElementById('bg-fullscreen-wrap');
      const fsWash = document.getElementById('bg-wash-layer');
      const posterSec = document.getElementById('poster-top-section');
      const btnFs = document.getElementById('mode-fullscreen');
      const btnPoster = document.getElementById('mode-poster');

      if (settings.layoutMode === 'fullscreen') {
        fsWrap.classList.remove('hidden');
        fsWash.classList.remove('hidden');
        posterSec.classList.add('hidden');
        btnFs.className = 'py-1.5 rounded-lg font-semibold transition bg-white text-rose-900 shadow-sm cursor-pointer';
        btnPoster.className = 'py-1.5 rounded-lg font-semibold transition text-rose-700 hover:text-rose-950 cursor-pointer';
      } else {
        fsWrap.classList.add('hidden');
        fsWash.classList.add('hidden');
        posterSec.classList.remove('hidden');
        btnPoster.className = 'py-1.5 rounded-lg font-semibold transition bg-white text-rose-900 shadow-sm cursor-pointer';
        btnFs.className = 'py-1.5 rounded-lg font-semibold transition text-rose-700 hover:text-rose-950 cursor-pointer';
      }

      // Photo Framing
      document.querySelectorAll('.pos-btn').forEach(btn => {
        const active = btn.dataset.pos === settings.photoPosition;
        btn.className = active
          ? 'pos-btn py-1.5 rounded-lg font-semibold transition bg-white text-stone-900 shadow-sm cursor-pointer'
          : 'pos-btn py-1.5 rounded-lg font-semibold transition text-stone-600 hover:text-stone-900 cursor-pointer';
      });

      // Calendar View Mode
      const yearView = document.getElementById('full-year-view');
      const monthView = document.getElementById('month-focus-view');
      const btnYear = document.getElementById('view-year');
      const btnMonth = document.getElementById('view-month');

      if (settings.viewMode === 'year') {
        yearView.classList.remove('hidden');
        monthView.classList.add('hidden');
        btnYear.className = 'py-1.5 rounded-lg font-semibold transition bg-white text-purple-950 shadow-sm cursor-pointer';
        btnMonth.className = 'py-1.5 rounded-lg font-semibold transition text-purple-700 hover:text-purple-950 cursor-pointer';
      } else {
        yearView.classList.add('hidden');
        monthView.classList.remove('hidden');
        btnMonth.className = 'py-1.5 rounded-lg font-semibold transition bg-white text-purple-950 shadow-sm cursor-pointer';
        btnYear.className = 'py-1.5 rounded-lg font-semibold transition text-purple-700 hover:text-purple-950 cursor-pointer';
        renderMonthFocus();
      }

      // Toggles
      syncSwitch('toggle-countdown', 'toggle-countdown-knob', settings.showCountdown);
      renderNextCountdownPill();

      syncSwitch('toggle-ambient', 'toggle-ambient-knob', settings.ambientParticles);
      updateAmbientAnimation();
    }

    function syncSwitch(btnId, knobId, isOn) {
      const btn = document.getElementById(btnId);
      const knob = document.getElementById(knobId);
      btn.setAttribute('aria-checked', String(isOn));
      if (isOn) {
        btn.classList.remove('bg-stone-300');
        btn.classList.add('bg-rose-500');
        knob.classList.remove('translate-x-1');
        knob.classList.add('translate-x-4');
      } else {
        btn.classList.add('bg-stone-300');
        btn.classList.remove('bg-rose-500');
        knob.classList.add('translate-x-1');
        knob.classList.remove('translate-x-4');
      }
    }

    /* =========================================================================
       5. RENDER LIVE COUNTDOWN PILL & BOTTOM HORIZONTAL LEGEND
       ========================================================================= */
    function renderNextCountdownPill() {
      const wrap = document.getElementById('next-countdown-wrap');
      if (!settings.showCountdown) {
        wrap.innerHTML = '';
        return;
      }

      const all = getAllMilestonesSorted();
      const upcoming = all.find(m => getDaysDiff(m.key) >= 0) || all[0];
      if (!upcoming) {
        wrap.innerHTML = '';
        return;
      }

      wrap.innerHTML = `
        <button
          type="button"
          onclick="jumpToDate('${upcoming.key}')"
          class="liquid-glass rounded-2xl sm:rounded-full px-3.5 sm:px-4 py-1.5 text-[11px] sm:text-xs font-semibold text-[#1c1917] crisp-text inline-flex flex-wrap items-center justify-center gap-x-2 gap-y-1 max-w-full hover:scale-[1.02] transition cursor-pointer"
          style="background-color: rgba(255, 255, 255, 0.52);"
        >
          <span class="inline-flex items-center gap-1.5">
            <span>${upcoming.icon}</span>
            <span>Next: <strong class="text-[#c81e3a] font-bold">${escapeHtml(upcoming.title)}</strong></span>
          </span>
          <span class="px-2 py-0.5 rounded-full bg-white/90 text-[#c81e3a] font-bold text-[10px] sm:text-[11px] whitespace-nowrap">${getCountdownText(upcoming.key)}</span>
        </button>
      `;
    }

    function renderBottomLegend() {
      const legend = document.getElementById('bottom-legend');
      const all = getAllMilestonesSorted();

      legend.innerHTML = all.map((m, idx) => {
        const sep = idx < all.length - 1 ? '<span class="hidden sm:inline text-stone-400 select-none">|</span>' : '';
        return `
          <button
            type="button"
            onclick="jumpToDate('${m.key}')"
            class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full hover:bg-white/75 transition cursor-pointer"
          >
            <span class="text-sm sm:text-base">${m.icon}</span>
            <span>${formatShortDate(m.key)}: ${escapeHtml(m.title)}</span>
          </button>
          ${sep}
        `;
      }).join('');
    }

    /* =========================================================================
       6. RENDER FULL-YEAR 12-MONTH CALENDAR (SUNDAY TO SATURDAY)
       ========================================================================= */
    function renderFullYearCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let m = 0; m < 12; m++) {
        const card = document.createElement('article');
        card.className = 'liquid-glass liquid-glass-card rounded-3xl p-4 sm:p-5 flex flex-col';

        // Clickable Month Header (opens Monthly Focus for that month)
        const titleBtn = document.createElement('button');
        titleBtn.type = 'button';
        titleBtn.className = 'text-center font-bold text-sm sm:text-base tracking-widest text-[#1c1917] crisp-text mb-2.5 hover:text-[#c81e3a] transition cursor-pointer';
        titleBtn.textContent = MONTH_NAMES[m];
        titleBtn.title = `Open ${MONTH_TITLE_CASE[m]} 2027 focus view`;
        titleBtn.addEventListener('click', () => {
          settings.focusMonth = m;
          settings.viewMode = 'month';
          applyAppearance();
          persistAll(null);
        });
        card.appendChild(titleBtn);

        // Weekday Header Row: S M T W T F S (Sunday in crimson)
        const wkRow = document.createElement('div');
        wkRow.className = 'grid grid-cols-7 gap-1 text-center mb-1.5';
        WEEKDAYS_SINGLE.forEach((dayChar, idx) => {
          const span = document.createElement('span');
          span.className = idx === 0
            ? 'text-xs font-bold text-[#c81e3a] crisp-text select-none'
            : 'text-xs font-bold text-[#1c1917] crisp-text select-none';
          span.textContent = dayChar;
          wkRow.appendChild(span);
        });
        card.appendChild(wkRow);

        // Days Grid
        const daysGrid = document.createElement('div');
        daysGrid.className = 'grid grid-cols-7 gap-1 text-center flex-1 items-center';

        const firstDayOfWeek = new Date(YEAR, m, 1).getDay();
        const daysInMonth = new Date(YEAR, m + 1, 0).getDate();

        for (let blank = 0; blank < firstDayOfWeek; blank++) {
          const empty = document.createElement('div');
          empty.className = 'h-8 sm:h-9';
          daysGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateKey = formatDateKey(YEAR, m, day);
          const dayOfWeek = new Date(YEAR, m, day).getDay();
          const isSunday = dayOfWeek === 0;
          const holidayName = HOLIDAYS_2027[dateKey];
          const milestone = getMilestone(dateKey);
          const hasNote = Boolean(userData.notes[dateKey]?.trim());
          const sticker = userData.stickers[dateKey] || '';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.dateKey = dateKey;

          let classes = 'relative h-8 sm:h-9 w-full rounded-xl flex flex-col items-center justify-center transition-all duration-150 cursor-pointer focus:outline-none focus:ring-2 focus:ring-rose-400 ';

          if (milestone) {
            classes += `${milestone.cellClass} font-bold ${milestone.textClass} hover:scale-110 `;
          } else {
            classes += 'hover:bg-white/65 active:scale-95 ';
            if (isSunday || holidayName) {
              classes += 'text-[#c81e3a] font-bold ';
            } else {
              classes += 'text-[#1c1917] font-semibold ';
            }
          }

          btn.className = classes;

          const tooltipParts = [`${WEEKDAYS_FULL[dayOfWeek]}, ${MONTH_TITLE_CASE[m]} ${day}, ${YEAR}`];
          if (milestone) tooltipParts.push(`${milestone.icon} ${milestone.title}`);
          if (holidayName) tooltipParts.push(`Holiday: ${holidayName}`);
          if (sticker) tooltipParts.push(`Tag: ${sticker}`);
          if (hasNote) tooltipParts.push('Personal note saved');
          btn.title = tooltipParts.join(' • ');

          if (milestone) {
            btn.innerHTML = `
              <span class="text-[11px] sm:text-xs leading-none">${day}</span>
              <span class="text-[10px] leading-none mt-0.5">${milestone.icon}</span>
            `;
          } else {
            btn.innerHTML = `<span class="text-xs sm:text-[13px] leading-none">${day}</span>`;
            if (sticker) {
              btn.innerHTML += `<span class="absolute -top-1 -right-0.5 text-[9px] leading-none pointer-events-none">${sticker}</span>`;
            }
          }

          if (hasNote) {
            const dot = document.createElement('span');
            dot.className = 'absolute bottom-0.5 w-1.5 h-1.5 rounded-full bg-rose-500';
            btn.appendChild(dot);
          }

          btn.addEventListener('click', () => handleDateClick(dateKey));
          daysGrid.appendChild(btn);
        }

        card.appendChild(daysGrid);
        grid.appendChild(card);
      }
    }

    /* =========================================================================
       7. RENDER RESPONSIVE MONTHLY FOCUS VIEW (DESKTOP & MOBILE)
       ========================================================================= */
    function renderMonthFocus() {
      const m = settings.focusMonth;
      document.getElementById('focus-month-title').textContent = `${MONTH_TITLE_CASE[m]} ${YEAR}`;

      // Sync Month Dropdown
      const monthSelect = document.getElementById('focus-month-select');
      if (monthSelect.options.length === 0) {
        MONTH_TITLE_CASE.forEach((name, idx) => {
          const opt = document.createElement('option');
          opt.value = String(idx);
          opt.textContent = name;
          monthSelect.appendChild(opt);
        });
      }
      monthSelect.value = String(m);

      // Render 12-month quick-jump pill bar
      const pillBar = document.getElementById('focus-month-pills');
      pillBar.innerHTML = SHORT_MONTHS.map((label, idx) => {
        const active = idx === m;
        return `
          <button
            type="button"
            onclick="setFocusMonth(${idx})"
            class="px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-bold transition whitespace-nowrap shrink-0 cursor-pointer ${
              active
                ? 'bg-[#c81e3a] text-white shadow-sm'
                : 'bg-white/60 hover:bg-white text-[#1c1917] border border-white/75'
            }"
          >${label}</button>
        `;
      }).join('');

      const grid = document.getElementById('focus-days-grid');
      grid.innerHTML = '';

      const firstDayOfWeek = new Date(YEAR, m, 1).getDay();
      const daysInMonth = new Date(YEAR, m + 1, 0).getDate();
      const monthEventsList = [];

      for (let blank = 0; blank < firstDayOfWeek; blank++) {
        const empty = document.createElement('div');
        empty.className = 'month-day-cell rounded-xl sm:rounded-2xl bg-white/10';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = formatDateKey(YEAR, m, day);
        const dayOfWeek = new Date(YEAR, m, day).getDay();
        const isSunday = dayOfWeek === 0;
        const holidayName = HOLIDAYS_2027[dateKey];
        const milestone = getMilestone(dateKey);
        const noteText = userData.notes[dateKey]?.trim() || '';
        const sticker = userData.stickers[dateKey] || '';

        if (milestone || holidayName || noteText || sticker) {
          monthEventsList.push({
            dateKey,
            day,
            weekday: WEEKDAYS_FULL[dayOfWeek],
            milestone,
            holidayName,
            noteText,
            sticker
          });
        }

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.dataset.dateKey = dateKey;

        let cls = 'month-day-cell rounded-xl sm:rounded-2xl p-1.5 sm:p-2.5 flex flex-col justify-between text-left transition cursor-pointer border ';
        if (milestone) {
          cls += `${milestone.cellClass} hover:scale-[1.02] `;
        } else {
          cls += 'bg-white/40 hover:bg-white/75 border-white/65 ';
        }
        cell.className = cls;

        const numColor = milestone
          ? milestone.textClass
          : (isSunday || holidayName ? 'text-[#c81e3a]' : 'text-[#1c1917]');

        cell.innerHTML = `
          <div class="flex items-center justify-between w-full gap-0.5">
            <span class="text-xs sm:text-base font-bold leading-none ${numColor}">${day}</span>
            <span class="text-xs sm:text-sm leading-none shrink-0">${milestone ? milestone.icon : sticker}</span>
          </div>

          <!-- Compact dot indicators on mobile (< 768px) -->
          <div class="flex md:hidden items-center gap-1 mt-1">
            ${holidayName ? '<span class="w-1.5 h-1.5 rounded-full bg-[#c81e3a]"></span>' : ''}
            ${noteText ? '<span class="w-1.5 h-1.5 rounded-full bg-purple-600"></span>' : ''}
          </div>

          <!-- Truncated text badges on desktop (>= 768px) -->
          <div class="hidden md:flex flex-col gap-1 mt-1 w-full overflow-hidden">
            ${milestone ? `<span class="block w-full truncate text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-white/85 ${milestone.textClass}">${escapeHtml(milestone.title)}</span>` : ''}
            ${holidayName ? `<span class="block w-full truncate text-[10px] font-semibold px-1.5 py-0.5 rounded-md bg-red-50/95 text-[#c81e3a]">${escapeHtml(holidayName)}</span>` : ''}
            ${noteText ? `<span class="block w-full truncate text-[10px] px-1.5 py-0.5 rounded-md bg-white/85 text-stone-700">📝 ${escapeHtml(noteText)}</span>` : ''}
          </div>
        `;

        cell.addEventListener('click', () => handleDateClick(dateKey));
        grid.appendChild(cell);
      }

      // Populate Mobile Highlights & Notes List below the grid
      const mobileHighlights = document.getElementById('mobile-month-highlights');
      if (monthEventsList.length === 0) {
        mobileHighlights.innerHTML = `
          <p class="text-center text-xs text-stone-700 font-medium py-1">
            Tap any date above to add notes, stickers, or special milestones.
          </p>
        `;
      } else {
        mobileHighlights.innerHTML = `
          <h3 class="text-[11px] font-bold uppercase tracking-wider text-stone-700 mb-2">
            ${MONTH_TITLE_CASE[m]} Highlights &amp; Notes
          </h3>
          <div class="space-y-1.5">
            ${monthEventsList.map(item => `
              <button
                type="button"
                onclick="handleDateClick('${item.dateKey}')"
                class="w-full text-left rounded-xl bg-white/65 hover:bg-white/90 border border-white/80 px-3 py-2 flex items-start justify-between gap-2 transition cursor-pointer"
              >
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-xs font-bold ${item.milestone ? item.milestone.textClass : (item.holidayName ? 'text-[#c81e3a]' : 'text-[#1c1917]')}">
                      ${SHORT_MONTHS[m]} ${item.day}
                    </span>
                    ${item.milestone ? `<span class="text-[11px] font-bold ${item.milestone.textClass}">${item.milestone.icon} ${escapeHtml(item.milestone.title)}</span>` : ''}
                    ${item.holidayName ? `<span class="text-[11px] font-semibold text-[#c81e3a]">• ${escapeHtml(item.holidayName)}</span>` : ''}
                    ${item.sticker && !item.milestone ? `<span class="text-xs">${item.sticker}</span>` : ''}
                  </div>
                  ${item.noteText ? `<p class="text-[11px] text-stone-700 truncate mt-0.5">📝 ${escapeHtml(item.noteText)}</p>` : ''}
                </div>
                <span class="text-stone-400 text-xs shrink-0 self-center">&rsaquo;</span>
              </button>
            `).join('')}
          </div>
        `;
      }
    }

    window.setFocusMonth = function(idx) {
      settings.focusMonth = idx;
      renderMonthFocus();
      persistAll(null);
    };

    /* =========================================================================
       8. INTERACTIVE DATE MODAL, STICKERS, AUTO-SAVED NOTES & CUSTOM MILESTONES
       ========================================================================= */
    window.handleDateClick = function(dateKey) {
      const milestone = getMilestone(dateKey);
      if (milestone) {
        triggerCelebration(milestone.confettiColors, milestone.confettiShape);
      }
      openDateModal(dateKey);
    };

    function openDateModal(dateKey) {
      selectedDateKey = dateKey;
      const dateObj = parseDateKey(dateKey);
      const dayOfWeek = dateObj.getDay();
      const monthIndex = dateObj.getMonth();
      const dayNum = dateObj.getDate();

      document.getElementById('modal-weekday').textContent = WEEKDAYS_FULL[dayOfWeek];
      document.getElementById('modal-date-title').textContent = `${MONTH_TITLE_CASE[monthIndex]} ${dayNum}, ${YEAR}`;
      document.getElementById('modal-countdown-badge').textContent = getCountdownText(dateKey);

      const badgesContainer = document.getElementById('modal-badges');
      badgesContainer.innerHTML = '';

      const milestone = getMilestone(dateKey);
      const holidayName = HOLIDAYS_2027[dateKey];

      if (milestone) {
        badgesContainer.innerHTML += `
          <div class="p-3 rounded-2xl border ${milestone.bannerBg} flex items-center gap-3">
            <span class="text-2xl">${milestone.icon}</span>
            <div>
              <div class="font-bold text-sm ${milestone.textClass}">${escapeHtml(milestone.title)}</div>
              <div class="text-xs text-stone-600">${escapeHtml(milestone.subtitle)}</div>
            </div>
          </div>
        `;
      }

      if (holidayName) {
        badgesContainer.innerHTML += `
          <div class="p-3 rounded-2xl bg-red-50/90 border border-red-200 flex items-center gap-3">
            <span class="text-xl">🗓️</span>
            <div>
              <div class="font-bold text-sm text-[#c81e3a]">Public Holiday</div>
              <div class="text-xs text-red-700">${escapeHtml(holidayName)}</div>
            </div>
          </div>
        `;
      }

      if (dayOfWeek === 0 && !holidayName && !milestone) {
        badgesContainer.innerHTML += `
          <div class="px-3 py-2 rounded-2xl bg-rose-50/80 border border-rose-200/70 text-xs font-semibold text-[#c81e3a]">
            ☀️ Sunday Weekend
          </div>
        `;
      }

      // Render Sticker Picker
      const currentSticker = userData.stickers[dateKey] || '';
      const picker = document.getElementById('sticker-picker');
      picker.innerHTML = STICKERS.map(s => {
        const active = currentSticker === s.id;
        return `
          <button
            type="button"
            onclick="selectSticker('${s.id}')"
            class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
              active
                ? 'bg-rose-500 text-white border-rose-500 shadow-sm'
                : 'bg-white/80 hover:bg-rose-50 text-stone-700 border-rose-200/70'
            }"
            title="${s.label}"
          >
            ${s.emoji} <span class="text-[10px] ml-0.5">${s.label}</span>
          </button>
        `;
      }).join('');

      // Load Personal Note
      document.getElementById('modal-note-input').value = userData.notes[dateKey] || '';

      // Custom Milestone Section
      const customSec = document.getElementById('custom-milestone-section');
      const unpinBtn = document.getElementById('btn-remove-milestone');
      const emojiInput = document.getElementById('milestone-emoji-input');
      const titleInput = document.getElementById('milestone-title-input');

      if (DEFAULT_MILESTONES[dateKey]) {
        customSec.classList.add('hidden');
      } else {
        customSec.classList.remove('hidden');
        const existingCustom = userData.customMilestones[dateKey];
        if (existingCustom) {
          emojiInput.value = existingCustom.icon || '💖';
          titleInput.value = existingCustom.title || '';
          unpinBtn.classList.remove('hidden');
        } else {
          emojiInput.value = '💖';
          titleInput.value = '';
          unpinBtn.classList.add('hidden');
        }
      }

      const modal = document.getElementById('date-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDateModal() {
      const modal = document.getElementById('date-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      selectedDateKey = null;
    }

    window.selectSticker = function(stickerVal) {
      if (!selectedDateKey) return;
      if (stickerVal) {
        userData.stickers[selectedDateKey] = stickerVal;
      } else {
        delete userData.stickers[selectedDateKey];
      }
      persistAll('Tag saved locally');
      renderFullYearCalendar();
      if (settings.viewMode === 'month') renderMonthFocus();
      openDateModal(selectedDateKey);
    };

    function refreshAllViews() {
      renderFullYearCalendar();
      if (settings.viewMode === 'month') renderMonthFocus();
      renderBottomLegend();
      renderNextCountdownPill();
    }

    window.jumpToDate = function(dateKey) {
      closeDirectoryDrawer();
      const targetMonth = parseDateKey(dateKey).getMonth();
      if (settings.viewMode === 'month') {
        settings.focusMonth = targetMonth;
        renderMonthFocus();
      }
      const cell = document.querySelector(`[data-date-key="${dateKey}"]`);
      if (cell) {
        cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cell.classList.remove('date-pulse');
        void cell.offsetWidth;
        cell.classList.add('date-pulse');
      }
      const milestone = getMilestone(dateKey);
      if (milestone) {
        triggerCelebration(milestone.confettiColors, milestone.confettiShape);
      }
    };

    /* =========================================================================
       9. ALL NOTES & EVENTS DIRECTORY DRAWER
       ========================================================================= */
    function openDirectoryDrawer() {
      closeSettingsPopover();
      document.getElementById('directory-drawer-backdrop').classList.remove('hidden');
      renderDirectoryList();
    }

    function closeDirectoryDrawer() {
      document.getElementById('directory-drawer-backdrop').classList.add('hidden');
    }

    function renderDirectoryList() {
      const listEl = document.getElementById('directory-list');
      const query = document.getElementById('directory-search').value.trim().toLowerCase();
      const entries = [];

      getAllMilestonesSorted().forEach(m => {
        entries.push({
          key: m.key,
          type: 'milestones',
          icon: m.icon,
          title: m.title,
          subtitle: `${formatShortDate(m.key)}, 2027 • ${getCountdownText(m.key)}`,
          badge: 'Special',
          badgeClass: 'bg-rose-100 text-rose-800'
        });
      });

      Object.keys(userData.notes).sort().forEach(k => {
        const txt = userData.notes[k]?.trim();
        if (txt) {
          entries.push({
            key: k,
            type: 'notes',
            icon: userData.stickers[k] || '📝',
            title: txt,
            subtitle: `${formatShortDate(k)}, 2027 • Personal Note`,
            badge: 'Note',
            badgeClass: 'bg-purple-100 text-purple-800'
          });
        }
      });

      Object.keys(HOLIDAYS_2027).sort().forEach(k => {
        entries.push({
          key: k,
          type: 'holidays',
          icon: '🗓️',
          title: HOLIDAYS_2027[k],
          subtitle: `${formatShortDate(k)}, 2027`,
          badge: 'Holiday',
          badgeClass: 'bg-red-100 text-[#c81e3a]'
        });
      });

      const filtered = entries.filter(item => {
        const matchesTab = directoryFilter === 'all' || item.type === directoryFilter;
        const matchesQuery = !query ||
          item.title.toLowerCase().includes(query) ||
          item.subtitle.toLowerCase().includes(query);
        return matchesTab && matchesQuery;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-center text-xs text-stone-500 py-8">No matching events or notes found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <button
          type="button"
          onclick="jumpToDate('${item.key}')"
          class="w-full text-left p-3 rounded-2xl bg-white/80 hover:bg-white border border-rose-100 shadow-xs transition flex items-start gap-2.5 cursor-pointer"
        >
          <span class="text-lg leading-none mt-0.5">${item.icon}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-xs text-stone-900 truncate">${escapeHtml(item.title)}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${item.badgeClass}">${item.badge}</span>
            </div>
            <div class="text-[11px] text-stone-500 mt-0.5">${escapeHtml(item.subtitle)}</div>
          </div>
        </button>
      `).join('');
    }

    /* =========================================================================
       10. AMBIENT FLOATING HEARTS & PETALS (ACTIVE BY DEFAULT)
       ========================================================================= */
    const ambientCanvas = document.getElementById('ambient-canvas');
    const ambientCtx = ambientCanvas.getContext('2d');
    let ambientItems = [];
    let ambientFrameId = null;

    function resizeAmbientCanvas() {
      ambientCanvas.width = window.innerWidth;
      ambientCanvas.height = window.innerHeight;
    }

    function initAmbientParticles() {
      resizeAmbientCanvas();
      ambientItems = Array.from({ length: 24 }, () => ({
        x: Math.random() * ambientCanvas.width,
        y: Math.random() * ambientCanvas.height,
        size: 5 + Math.random() * 6.5,
        speedY: 0.32 + Math.random() * 0.55,
        drift: (Math.random() - 0.5) * 0.45,
        swayPhase: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.018,
        isHeart: Math.random() > 0.45,
        alpha: 0.24 + Math.random() * 0.24
      }));
    }

    function drawAmbientLoop() {
      if (!settings.ambientParticles) {
        ambientCtx.clearRect(0, 0, ambientCanvas.width, ambientCanvas.height);
        ambientFrameId = null;
        return;
      }

      ambientCtx.clearRect(0, 0, ambientCanvas.width, ambientCanvas.height);

      for (const p of ambientItems) {
        p.swayPhase += 0.015;
        p.x += p.drift + Math.sin(p.swayPhase) * 0.28;
        p.y += p.speedY;
        p.rot += p.rotSpeed;

        if (p.y > ambientCanvas.height + 24) {
          p.y = -20;
          p.x = Math.random() * ambientCanvas.width;
        }
        if (p.x < -24) p.x = ambientCanvas.width + 24;
        if (p.x > ambientCanvas.width + 24) p.x = -24;

        ambientCtx.save();
        ambientCtx.translate(p.x, p.y);
        ambientCtx.rotate(p.rot);
        ambientCtx.globalAlpha = p.alpha;
        ambientCtx.fillStyle = p.isHeart ? '#f43f5e' : '#f9a8d4';

        if (p.isHeart) {
          const s = p.size * 0.52;
          ambientCtx.beginPath();
          ambientCtx.moveTo(0, s);
          ambientCtx.bezierCurveTo(-s * 2, -s * 0.5, -s, -s * 2, 0, -s * 0.7);
          ambientCtx.bezierCurveTo(s, -s * 2, s * 2, -s * 0.5, 0, s);
          ambientCtx.fill();
        } else {
          // Soft cherry-blossom / rose petal silhouette
          ambientCtx.beginPath();
          ambientCtx.ellipse(0, 0, p.size * 0.48, p.size * 0.88, 0, 0, Math.PI * 2);
          ambientCtx.fill();
        }
        ambientCtx.restore();
      }

      ambientFrameId = requestAnimationFrame(drawAmbientLoop);
    }

    function updateAmbientAnimation() {
      if (settings.ambientParticles && !ambientFrameId) {
        if (ambientItems.length === 0) initAmbientParticles();
        drawAmbientLoop();
      }
    }

    /* =========================================================================
       11. CELEBRATION HEARTS & CONFETTI BURST ON MILESTONE CLICK
       ========================================================================= */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiFrameId = null;

    function resizeConfettiCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    function triggerCelebration(colors, shape = 'confetti') {
      resizeConfettiCanvas();
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.36;

      for (let i = 0; i < 65; i++) {
        const angle = (Math.PI * 2 * i) / 65 + (Math.random() - 0.5) * 0.35;
        const speed = 4 + Math.random() * 8.5;
        confettiParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3.5,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.16,
          alpha: 1,
          shape: shape === 'heart' || Math.random() > 0.65 ? 'heart' : 'rect'
        });
      }

      if (!confettiFrameId) animateConfetti();
    }

    function drawHeart(ctx, x, y, size, color, rot, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillStyle = color;
      ctx.beginPath();
      const s = size * 0.55;
      ctx.moveTo(0, s);
      ctx.bezierCurveTo(-s * 2, -s * 0.5, -s, -s * 2, 0, -s * 0.7);
      ctx.bezierCurveTo(s, -s * 2, s * 2, -s * 0.5, 0, s);
      ctx.fill();
      ctx.restore();
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.24;
        p.vx *= 0.985;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.013;

        if (p.shape === 'heart') {
          drawHeart(confettiCtx, p.x, p.y, p.size * 1.3, p.color, p.rotation, p.alpha);
        } else {
          confettiCtx.save();
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate(p.rotation);
          confettiCtx.globalAlpha = Math.max(0, p.alpha);
          confettiCtx.fillStyle = p.color;
          confettiCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
          confettiCtx.restore();
        }
      });

      confettiParticles = confettiParticles.filter(p => p.alpha > 0);
      if (confettiParticles.length > 0) {
        confettiFrameId = requestAnimationFrame(animateConfetti);
      } else {
        confettiFrameId = null;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    /* =========================================================================
       12. SETTINGS POPOVER & EVENT BINDINGS
       ========================================================================= */
    function openSettingsPopover() {
      document.getElementById('settings-popover').classList.remove('hidden');
      document.getElementById('settings-fab').setAttribute('aria-expanded', 'true');
    }

    function closeSettingsPopover() {
      document.getElementById('settings-popover').classList.add('hidden');
      document.getElementById('settings-fab').setAttribute('aria-expanded', 'false');
    }

    function initEventListeners() {
      // Settings FAB Toggle
      document.getElementById('settings-fab').addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = document.getElementById('settings-popover').classList.contains('hidden');
        isHidden ? openSettingsPopover() : closeSettingsPopover();
      });

      document.getElementById('btn-close-popover').addEventListener('click', closeSettingsPopover);

      document.addEventListener('click', (e) => {
        const pop = document.getElementById('settings-popover');
        const fab = document.getElementById('settings-fab');
        if (!pop.classList.contains('hidden') && !pop.contains(e.target) && !fab.contains(e.target)) {
          closeSettingsPopover();
        }
      });

      // View Mode
      document.getElementById('view-year').addEventListener('click', () => {
        settings.viewMode = 'year';
        applyAppearance();
        persistAll('Full Year view saved');
      });

      document.getElementById('view-month').addEventListener('click', () => {
        settings.viewMode = 'month';
        applyAppearance();
        persistAll('Monthly Focus view saved');
      });

      // Background Layout Mode
      document.getElementById('mode-fullscreen').addEventListener('click', () => {
        settings.layoutMode = 'fullscreen';
        applyAppearance();
        persistAll('Full-Screen mode saved');
      });

      document.getElementById('mode-poster').addEventListener('click', () => {
        settings.layoutMode = 'poster';
        applyAppearance();
        persistAll('Poster Header mode saved');
      });

      // Glass Glossiness Slider
      const glossSlider = document.getElementById('gloss-slider');
      glossSlider.addEventListener('input', (e) => {
        settings.glassGlossiness = Number(e.target.value);
        applyAppearance();
      });
      glossSlider.addEventListener('change', () => persistAll('Saved locally'));

      // Photo Framing
      document.querySelectorAll('.pos-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          settings.photoPosition = btn.dataset.pos;
          applyAppearance();
          persistAll('Saved locally');
        });
      });

      // Ambient Hearts & Petals Toggle
      document.getElementById('toggle-ambient').addEventListener('click', () => {
        settings.ambientParticles = !settings.ambientParticles;
        applyAppearance();
        persistAll('Saved locally');
      });

      // Live Countdown Toggle
      document.getElementById('toggle-countdown').addEventListener('click', () => {
        settings.showCountdown = !settings.showCountdown;
        applyAppearance();
        persistAll('Saved locally');
      });

      // Directory Drawer
      document.getElementById('btn-open-directory').addEventListener('click', openDirectoryDrawer);
      document.getElementById('btn-close-directory').addEventListener('click', closeDirectoryDrawer);
      document.getElementById('directory-drawer-backdrop').addEventListener('click', (e) => {
        if (e.target === document.getElementById('directory-drawer-backdrop')) closeDirectoryDrawer();
      });
      document.getElementById('directory-search').addEventListener('input', renderDirectoryList);
      document.querySelectorAll('.dir-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          directoryFilter = btn.dataset.filter;
          document.querySelectorAll('.dir-filter-btn').forEach(b => {
            b.className = b === btn
              ? 'dir-filter-btn py-1.5 rounded-lg bg-white text-rose-900 shadow-sm cursor-pointer'
              : 'dir-filter-btn py-1.5 rounded-lg text-stone-600 cursor-pointer';
          });
          renderDirectoryList();
        });
      });

      // Upload / Reset Photo
      const fileInput = document.getElementById('photo-upload-input');
      document.getElementById('btn-change-photo').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (file) processUploadedPhoto(file);
        fileInput.value = '';
      });

      document.getElementById('btn-reset-photo').addEventListener('click', () => {
        userData.customPhotoDataUrl = null;
        refreshBackgroundImages();
        persistAll('Restored default portrait');
      });

      // JSON Export / Import
      document.getElementById('btn-export-json').addEventListener('click', () => {
        const payload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          settings,
          userData: {
            notes: userData.notes,
            stickers: userData.stickers,
            customMilestones: userData.customMilestones
          }
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '2027-couple-calendar-backup.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Backup exported');
      });

      const jsonInput = document.getElementById('json-import-input');
      document.getElementById('btn-import-json').addEventListener('click', () => jsonInput.click());
      jsonInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (imported.settings) settings = { ...settings, ...imported.settings };
            if (imported.userData) {
              userData.notes = imported.userData.notes || {};
              userData.stickers = imported.userData.stickers || {};
              userData.customMilestones = imported.userData.customMilestones || {};
            }
            applyAppearance();
            refreshAllViews();
            persistAll('Backup restored locally');
          } catch (err) {
            showToast('Invalid JSON backup file');
          }
        };
        reader.readAsText(file);
        jsonInput.value = '';
      });

      // Print / Save PDF
      document.getElementById('btn-print').addEventListener('click', () => {
        closeSettingsPopover();
        setTimeout(() => window.print(), 120);
      });

      // Monthly Focus Navigation Controls
      document.getElementById('btn-prev-month').addEventListener('click', () => {
        settings.focusMonth = (settings.focusMonth + 11) % 12;
        renderMonthFocus();
        persistAll(null);
      });

      document.getElementById('btn-next-month').addEventListener('click', () => {
        settings.focusMonth = (settings.focusMonth + 1) % 12;
        renderMonthFocus();
        persistAll(null);
      });

      document.getElementById('focus-month-select').addEventListener('change', (e) => {
        settings.focusMonth = Number(e.target.value);
        renderMonthFocus();
        persistAll(null);
      });

      document.getElementById('btn-back-year').addEventListener('click', () => {
        settings.viewMode = 'year';
        applyAppearance();
        persistAll(null);
      });

      // Date Modal Controls & Auto-Save Note
      document.getElementById('btn-close-modal').addEventListener('click', closeDateModal);
      document.getElementById('date-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('date-modal')) closeDateModal();
      });

      let noteDebounce = null;
      document.getElementById('modal-note-input').addEventListener('input', (e) => {
        if (!selectedDateKey) return;
        const val = e.target.value;
        if (val.trim()) {
          userData.notes[selectedDateKey] = val;
        } else {
          delete userData.notes[selectedDateKey];
        }
        clearTimeout(noteDebounce);
        noteDebounce = setTimeout(() => {
          persistAll('Note saved locally');
          refreshAllViews();
        }, 350);
      });

      // Pin / Unpin Custom Milestone
      document.getElementById('btn-save-milestone').addEventListener('click', () => {
        if (!selectedDateKey) return;
        const title = document.getElementById('milestone-title-input').value.trim();
        const icon = document.getElementById('milestone-emoji-input').value.trim() || '💖';
        if (!title) {
          showToast('Enter a milestone title first');
          return;
        }
        userData.customMilestones[selectedDateKey] = { title, icon };
        persistAll('Milestone pinned locally');
        refreshAllViews();
        openDateModal(selectedDateKey);
        triggerCelebration(['#9333ea', '#c084fc', '#ec4899', '#fbbf24'], 'heart');
      });

      document.getElementById('btn-remove-milestone').addEventListener('click', () => {
        if (!selectedDateKey) return;
        delete userData.customMilestones[selectedDateKey];
        persistAll('Milestone unpinned');
        refreshAllViews();
        openDateModal(selectedDateKey);
      });

      // Keyboard Shortcuts (Escape & Left/Right arrows in Monthly Focus)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeDateModal();
          closeSettingsPopover();
          closeDirectoryDrawer();
        } else if (
          settings.viewMode === 'month' &&
          document.getElementById('date-modal').classList.contains('hidden') &&
          document.getElementById('directory-drawer-backdrop').classList.contains('hidden') &&
          !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)
        ) {
          if (e.key === 'ArrowLeft') {
            settings.focusMonth = (settings.focusMonth + 11) % 12;
            renderMonthFocus();
            persistAll(null);
          } else if (e.key === 'ArrowRight') {
            settings.focusMonth = (settings.focusMonth + 1) % 12;
            renderMonthFocus();
            persistAll(null);
          }
        }
      });

      // Responsive Canvas Resizing
      window.addEventListener('resize', () => {
        resizeAmbientCanvas();
        if (confettiFrameId) resizeConfettiCanvas();
      });
    }

    /* =========================================================================
       13. BOOTSTRAP APPLICATION ON WINDOW LOAD
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      refreshBackgroundImages();
      initAmbientParticles();
      applyAppearance();
      refreshAllViews();
      initEventListeners();
    });
  </script>
</body>
</html>
